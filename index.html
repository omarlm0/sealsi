<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <title>SEALSI — Le propre. L’esprit léger.</title>
    <meta
      name="description"
      content="Découvrez SEALSI Oceanic Scent, la lessive liquide 5 L inspirée de l’océan. Format 5 litres, 3 bouteilles par carton, tarif sur confirmation."
    />
    <link rel="canonical" href="https://www.sealsi.com/" />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#061A40" />

    <!-- Open Graph / aperçu social. Domaine à confirmer avant mise en ligne. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SEALSI" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.sealsi.com/" />
    <meta property="og:title" content="SEALSI — Le propre. L’esprit léger." />
    <meta
      property="og:description"
      content="Oceanic Scent, lessive liquide SEALSI 5 L. 1 carton = 3 bouteilles = 15 litres. Tarif et modalités confirmés selon votre demande."
    />
    <meta property="og:image" content="https://www.sealsi.com/assets/sealsi-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bouteille SEALSI Oceanic Scent 5 litres sur fond marine"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SEALSI — Le propre. L’esprit léger." />
    <meta
      name="twitter:description"
      content="Oceanic Scent, lessive liquide SEALSI 5 L. Tarif et modalités confirmés selon votre demande."
    />
    <meta name="twitter:image" content="https://www.sealsi.com/assets/sealsi-og.jpg" />

    <!--
      The hero packshot is the home page LCP element. It is rendered by React,
      so preload it here to make the request discoverable in the initial HTML.
      imagesrcset/imagesizes mirror the <img> in HomePage so the same candidate
      is chosen (no double download).
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/sealsi-oceanic-packshot.webp"
      imagesrcset="/assets/sealsi-oceanic-packshot-320.webp 320w, /assets/sealsi-oceanic-packshot-480.webp 480w, /assets/sealsi-oceanic-packshot.webp 575w, /assets/sealsi-oceanic-packshot-640.webp 640w"
      imagesizes="(max-width: 760px) 70vw, 40vw"
      fetchpriority="high"
    />

    <link rel="icon" type="image/svg+xml" href="/assets/sealsi-star.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 720px; margin: 4rem auto; padding: 1.5rem; font-family: 'Segoe UI', Arial, sans-serif; color: #061a40;">
        <h1>SEALSI — Oceanic Scent</h1>
        <p>
          Ce site nécessite JavaScript pour afficher le produit et préparer une sélection de
          cartons. Activez JavaScript pour poursuivre la visite.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
